# WasFit — deploy Netlify (opcional). O redirect de www está em _redirects.
[build]
  publish = "."

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(self), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    # Ao ativar GTM/GA: acrescentar googletagmanager/google-analytics em
    # script-src / connect-src / img-src. Ao usar contato.formEndpoint,
    # acrescentar o host dele em connect-src.
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-djPdT5J1kuWFwawDhtbzz0YHt/63i3CUBG3CyUjLa4c=' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' 'sha256-7FDHf6k/mYN8dgP2RKM2G6hbEQXg/wPZF8+6cX0IGcE=' 'sha256-uuMEqQMblMfuiu3Q+Td+sf6xbR6KL6vkmW8VdthNRbc=' 'sha256-XlXghU+xlMp/KNKjrvnIkC4hwlKeLUG/cxR0xhMvv9M=' 'sha256-8SzQWASgseuFeRUD7hmIwMR7tIG97Q2i7gg5dK7fVPw='; connect-src 'self' https://script.google.com https://v1.api.wasfit.com.br; media-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
